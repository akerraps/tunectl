services:
  tunectl:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/tunectl
      - ~/.gitconfig:/home/vscode/.gitconfig:ro
      - ~/.ssh:/home/vscode/.ssh:ro
      - ~/Music:/home/vscode/Music
      - ~/.cache/tunectl:/home/vscode/.cache/tunectl
    working_dir: /workspaces/tunectl
    command: sleep infinity
    user: vscode
    restart: unless-stopped